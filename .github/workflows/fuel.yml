name: Update fuel prices
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch prices
        run: node scripts/fuel.mjs
        env:
          FUEL_CLIENT_ID: ${{ secrets.FUEL_CLIENT_ID }}
          FUEL_CLIENT_SECRET: ${{ secrets.FUEL_CLIENT_SECRET }}
      - name: Commit if changed
        run: |
          git config user.name "jarvis-bot"
          git config user.email "jarvis-bot@users.noreply.github.com"
          git add fuel.json
          git diff --staged --quiet || (git commit -m "Update fuel prices" && git push)
