name: Update fuel prices
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect prices
        run: node scripts/fuel.mjs
        env:
          FUEL_CLIENT_ID: ${{ secrets.FUEL_CLIENT_ID }}
          FUEL_CLIENT_SECRET: ${{ secrets.FUEL_CLIENT_SECRET }}
          FUEL_PROXY_URL: ${{ secrets.FUEL_PROXY_URL }}
          FUEL_PROXY_KEY: ${{ secrets.FUEL_PROXY_KEY }}
      - name: Publish to the data branch
        run: |
          mkdir -p /tmp/pub && cp fuel.json /tmp/pub/fuel.json
          cd /tmp/pub
          git init -q -b data
          git config user.name "jarvis-bot"
          git config user.email "jarvis-bot@users.noreply.github.com"
          git add fuel.json
          git commit -q -m "Fuel prices $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
