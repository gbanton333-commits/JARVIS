<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#040b14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<title>JARVIS</title>
<style>
  :root{--bg:#040b14;--panel:#0a1a2b;--panel2:#0d2238;--ink:#e3f1fa;--dim:#7491a6;--glow:#4cc9f0;--warn:#f4a259;--ok:#5ee6a8;--bad:#ff6b6b;--line:#15324c}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
       background:radial-gradient(120% 50% at 50% 0%,#0b2a47 0%,var(--bg) 62%)}
  button,a{font:inherit;color:inherit}
  header{display:flex;justify-content:space-between;align-items:center;padding:10px 18px 4px}
  h1{font-size:.78rem;letter-spacing:.42em;font-weight:600;margin:0;color:var(--dim)}
  .hb{display:flex;gap:6px}
  .pill{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:5px 11px;font-size:.74rem}
  .pill.on{color:var(--glow);border-color:var(--glow)}
  #main{flex:1;overflow-y:auto;padding:6px 18px 12px;-webkit-overflow-scrolling:touch}
  #hero{padding:10px 0 16px}
  #hello{font-size:.95rem;color:var(--dim)}
  #clock{font-size:3.2rem;font-weight:200;letter-spacing:.02em;line-height:1.05;margin-top:2px}
  #date{font-size:.85rem;color:var(--dim);margin-top:2px}
  #tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;position:relative;min-height:84px}
  .tile.wide{grid-column:1/-1}
  .ct{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
  .n{font-size:2.1rem;font-weight:300;line-height:1.1}
  .n2{font-size:1.9rem;font-weight:300;margin-top:4px}
  .sub{font-size:.8rem;color:var(--dim);margin-top:2px}
  .row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:4px}
  .chip{font-size:.72rem;padding:2px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
  .ok{color:var(--ok)}.am{color:var(--warn)}.rd{color:var(--bad)}.gl{color:var(--glow)}
  #swap{position:absolute;top:10px;right:10px;background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:999px;width:30px;height:30px;font-size:.9rem}
  #news div{font-size:.82rem;line-height:1.35;padding:6px 0;border-top:1px solid var(--line)}
  #news div:first-child{border-top:0}
  #log{display:flex;flex-direction:column;gap:12px;padding-top:16px}
  .m{max-width:92%;line-height:1.5;font-size:.97rem}
  .u{align-self:flex-end;color:var(--dim);font-size:.92rem}
  .j{align-self:flex-start;border-left:2px solid var(--glow);padding-left:12px}
  .e{align-self:flex-start;border-left:2px solid var(--warn);padding-left:12px;color:var(--warn)}
  .card{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;justify-content:space-between;gap:10px;font-size:.82rem;border-top:1px solid var(--line);padding-top:8px;color:var(--dim)}
  .opt b{color:var(--ink);font-weight:500}
  .inc{font-size:.82rem;color:var(--warn)}
  .inc.none{color:var(--ok)}
  .wx{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  .wx div{flex:0 0 auto;min-width:74px;font-size:.7rem;color:var(--dim);border-left:1px solid var(--line);padding-left:8px}
  .wx div:first-child{border-left:0;padding-left:0}
  .wx b{display:block;color:var(--ink);font-size:1rem;font-weight:400}
  .map{height:190px;border-radius:12px;overflow:hidden;background:#07111c}
  .acts{display:flex;gap:8px}
  .btn{flex:1;text-align:center;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:11px 8px;font-size:.85rem;color:var(--ink)}
  .btn.pri{background:var(--glow);border-color:var(--glow);color:#02101c;font-weight:600;flex:2}
  /* map */
  .leaflet-container{background:#07111c;font:inherit}
  .leaflet-control-attribution{background:transparent!important;color:#3d566a!important;font-size:8px!important}
  .leaflet-control-attribution a{color:#4a6a82!important}
  .mk-start{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 5px #5ee6a826}
  .mk-end{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 12px #4cc9f0}
  .mk-inc{width:9px;height:9px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 0 #f4a259aa;animation:ping 1.8s infinite}
  @keyframes ping{70%{box-shadow:0 0 0 9px #f4a25900}100%{box-shadow:0 0 0 0 #f4a25900}}
  .leaflet-tooltip{background:#0a1a2b;border:1px solid var(--line);color:var(--ink);font-size:11px;border-radius:8px;box-shadow:none}
  .leaflet-tooltip:before{display:none}
  /* dock */
  #dock{padding:6px 18px 10px;border-top:1px solid #0f2438;background:linear-gradient(180deg,#040b14aa,#040b14)}
  #status{text-align:center;font-size:.72rem;color:var(--dim);min-height:1em;letter-spacing:.06em;margin-bottom:6px}
  .q{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
  .q::-webkit-scrollbar,.wx::-webkit-scrollbar{display:none}
  .q button{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:.82rem}
  .q button:active{background:var(--panel2)}
  #bar{display:flex;align-items:center;gap:12px}
  form{flex:1;display:flex}
  input{flex:1;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:999px;color:var(--ink);padding:13px 16px;font-size:1rem}
  input::placeholder{color:#47637a}
  input:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
  #hud{width:72px;height:72px;flex:0 0 auto;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  #hud svg{width:100%;height:100%;overflow:visible;transition:transform .11s ease-out}
  #hud circle{fill:none;stroke:var(--glow);transform-box:fill-box;transform-origin:center}
  #hud .core{fill:#0b2a40;stroke-width:2;filter:drop-shadow(0 0 6px #4cc9f0aa)}
  #hud .r1{stroke-width:1.2;stroke-dasharray:2 5;opacity:.7;animation:spin 24s linear infinite}
  #hud .r2{stroke-width:2.6;stroke-dasharray:42 14 8 14;animation:spin 14s linear infinite reverse}
  #hud .r3{stroke-width:1.6;opacity:.85}
  #hud.listening .core{fill:#0e4466;animation:pulse 1s ease-in-out infinite}
  #hud.thinking .r2{animation-duration:2s}
  #hud.thinking .r1{animation-duration:4s}
  #hud.speaking .core{fill:#14587f}
  #hud.beat svg{transform:scale(1.09)}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{50%{transform:scale(1.2)}}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  #hero,.tile,.card,.m{animation:rise .45s ease both}

  /* boot screen */
  #boot{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 45%,#0b2a47,#030812 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .7s ease;cursor:pointer}
  #boot.out{opacity:0;pointer-events:none}
  #boot svg{width:150px;height:150px;overflow:visible}
  #boot circle{fill:none;stroke:var(--glow);transform-box:fill-box;transform-origin:center}
  .b1{stroke-width:1.5;stroke-dasharray:352;stroke-dashoffset:352;animation:draw 1.6s ease forwards}
  .b2{stroke-width:2.6;stroke-dasharray:60 20;animation:spin 6s linear infinite,fadein 1s .4s both}
  .b3{stroke-width:1;stroke-dasharray:2 6;animation:spin 18s linear infinite reverse}
  #boot .bcore{fill:#0e3f60;stroke-width:2;animation:glow 1.8s ease-in-out infinite;filter:drop-shadow(0 0 8px #4cc9f0aa)}
  .bt1{letter-spacing:.5em;font-size:1.05rem;font-weight:300;margin-right:-.5em}
  .bt2{font-size:.76rem;color:var(--dim);letter-spacing:.14em;min-height:1.2em}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes fadein{from{opacity:0}}
  @keyframes glow{50%{opacity:.55}}
  /* petrol tile */
  .split{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .sub.am{color:var(--warn)}
  #fSp{flex:0 0 auto}
  .stn{display:flex;justify-content:space-between;align-items:center;gap:10px;text-decoration:none;color:var(--ink);border-top:1px solid var(--line);padding:11px 0;font-size:.92rem}
  .stn:first-of-type{border-top:0}
  .stn .nm{min-width:0}.stn .nm b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stn .nm span{font-size:.74rem;color:var(--dim)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="boot" role="button" aria-label="Tap to begin">
  <svg viewBox="-60 -60 120 120"><circle class="b1" r="56"/><circle class="b2" r="46"/><circle class="b3" r="34"/><circle class="bcore" r="20"/></svg>
  <div class="bt1">J.A.R.V.I.S.</div>
  <div class="bt2" id="bootLine">Initialising core</div>
</div>
<header>
  <h1>J.A.R.V.I.S.</h1>
  <div class="hb"><button class="pill" id="hf">Hands-free</button><button class="pill" id="snd">Sound</button><button class="pill" id="cfg">Set up</button></div>
</header>

<div id="main">
  <section id="hero">
    <div id="hello">&nbsp;</div>
    <div id="clock">--:--</div>
    <div id="date">&nbsp;</div>
  </section>

  <section id="tiles">
    <div class="tile wide" id="tCommute" role="button" tabindex="0">
      <div class="ct" id="cDir">Commute</div>
      <div class="row"><span class="n" id="cMin">--</span><span class="chip" id="cChip"></span></div>
      <div class="sub" id="cSub">Checking traffic...</div>
      <button id="swap" aria-label="Swap direction">&#8646;</button>
    </div>
    <div class="tile" id="tHome"><div class="ct">Home</div><div class="n2" id="wH">--</div><div class="sub" id="wHd">&nbsp;</div></div>
    <div class="tile" id="tWork"><div class="ct">Work</div><div class="n2" id="wW">--</div><div class="sub" id="wWd">&nbsp;</div></div>
    <div class="tile wide split" id="tFuel" role="button" tabindex="0">
      <div>
        <div class="ct">Petrol (E10)</div>
        <div class="row"><span class="n" id="fP">--</span><span class="chip" id="fT"></span></div>
        <div class="sub" id="fS">&nbsp;</div>
        <div class="sub" id="fC">&nbsp;</div>
      </div>
      <svg id="fSp" width="96" height="30" viewBox="0 0 96 30"></svg>
    </div>
    <div class="tile wide" id="tNews" role="button" tabindex="0"><div class="ct">Headlines</div><div id="news"><div class="sub">Loading...</div></div></div>
  </section>

  <div id="log" aria-live="polite"></div>
</div>

<div id="dock">
  <div id="status">Tap the orb and speak</div>
  <div class="q">
    <button id="qb">Briefing</button><button id="qw">To work</button><button id="qh">To home</button><button id="ql">Leave by&hellip;</button><button id="qp">Petrol near me</button><button id="qr">Replay</button>
  </div>
  <div id="bar">
    <form id="f"><input id="t" placeholder="Type to JARVIS" autocomplete="off" enterkeyhint="send"></form>
    <div id="hud" role="button" tabindex="0" aria-label="Tap to talk">
      <svg viewBox="-60 -60 120 120"><circle class="r1" r="56"/><circle class="r2" r="46"/><circle class="r3" r="34"/><circle class="core" r="22"/></svg>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const main=$('main'),log=$('log'),hud=$('hud'),statusEl=$('status');
const IDLE='Tap the orb and speak';

const SYSTEM_BASE=`You are J.A.R.V.I.S., the user's personal AI, modelled on the assistant from the Iron Man films: formal, unflappable, dryly witty British manner; understated, never gushing. You address the user as "sir", though not in every sentence.
Style: your replies are spoken aloud, so use 1 to 4 short sentences, plain text, no lists, no markdown, no emoji. Lead with the verdict or status, then the key facts, then a recommendation or a brief offer such as "Shall I check the alternative?". Anticipate needs: if rain is likely, mention it; if a delay is building, suggest leaving earlier. Wit is dry and rare: at most one light remark, never at the cost of clarity. Phrases like "I'd advise", "might I suggest", "as you wish" and "all systems nominal" are welcome, sparingly. Never over-apologise; if you lack data, say so plainly, as in "I don't have that feed connected, sir".
Say "degrees" rather than "C", "miles per hour" rather than "mph", and spell out minutes, litres and pounds.
You have LIVE DATA below: weather at home and at work, plus UK and local headlines. Use only what is in it and never invent figures. Traffic, routes and fuel efficiency are not connected yet, so say so plainly if asked.
If asked for a briefing: a short greeting suited to the time of day, the weather at home, mention work only if it differs notably, then the three most important headlines in a sentence each. Under 90 words in total.`;

let history=[],live=null,liveAt=0,busy=false,lastReply='';
let handsFree=localStorage.getItem('hf')==='1';
let dir=(+londonPart('hour')<13)?'work':'home';
let commuteUI=null,commuteAt=0;

function londonPart(t){return new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',hourCycle:'h23',hour:'2-digit',minute:'2-digit',weekday:'long',day:'numeric',month:'long',year:'numeric'}).formatToParts(new Date()).find(p=>p.type===t).value}
const getWorker=()=>(localStorage.getItem('worker')||'').trim().replace(/\/+$/,'');
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function toEnd(){setTimeout(()=>main.scrollTo({top:main.scrollHeight,behavior:'smooth'}),60)}
function add(cls,text){log.appendChild(el('div','m '+cls,text));toEnd()}
function setState(s,msg){hud.className=s;statusEl.textContent=msg||IDLE}
function paintHF(){$('hf').classList.toggle('on',handsFree);$('hf').textContent='Hands-free '+(handsFree?'on':'off')}
$('hf').onclick=()=>{handsFree=!handsFree;localStorage.setItem('hf',handsFree?'1':'0');paintHF()};
$('cfg').onclick=()=>{const v=prompt('Paste your Cloudflare Worker URL:',getWorker());if(v!==null){localStorage.setItem('worker',v.trim());loadDash(true)}};
paintHF();


// ---------- sound ----------
let soundOn=localStorage.getItem('snd')!=='0';
let AC=null;
function ac(){
  if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}
  if(AC&&AC.state==='suspended')AC.resume();
  return AC;
}
function tone(freq,t0,dur,type,vol,glideTo){
  if(!soundOn)return;const a=ac();if(!a)return;
  const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;
  o.type=type||'sine';o.frequency.setValueAtTime(freq,t);
  if(glideTo)o.frequency.exponentialRampToValueAtTime(glideTo,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.06,t+.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.05);
}
const sfx={
  wake(){tone(587,0,.14,'sine',.07);tone(880,.09,.22,'sine',.07)},
  done(){tone(988,0,.14,'sine',.05)},
  err(){tone(220,0,.22,'triangle',.07,150)},
  boot(){tone(160,0,1,'sawtooth',.025,640);tone(440,.55,.25,'sine',.06);tone(660,.75,.25,'sine',.06);tone(990,.95,.55,'sine',.07)}
};
function paintSnd(){$('snd').classList.toggle('on',soundOn)}
$('snd').onclick=()=>{soundOn=!soundOn;localStorage.setItem('snd',soundOn?'1':'0');paintSnd();if(soundOn){ac();sfx.wake()}};
paintSnd();

// ---------- petrol tracker ----------
let fstore={};try{fstore=JSON.parse(localStorage.getItem('fuel')||'{}')}catch(e){}
fstore.hist=fstore.hist||[];
let fuelAuto=null;
const saveF=()=>localStorage.setItem('fuel',JSON.stringify(fstore));
function effPrice(){
  const now=Date.now();
  if(fstore.manual&&now-fstore.manual.ts<7*864e5)return{ppl:fstore.manual.ppl,src:'set by you',ts:fstore.manual.ts};
  if(fuelAuto&&fuelAuto.ts&&now-fuelAuto.ts<3*864e5)return{ppl:fuelAuto.ppl,src:'local average',ts:fuelAuto.ts,extra:fuelAuto.cheapest};
  if(fstore.manual)return{ppl:fstore.manual.ppl,src:'set by you',ts:fstore.manual.ts,stale:true};
  return{ppl:140,src:'default estimate',ts:0,stale:true};
}
function ago(ts){const h=(Date.now()-ts)/36e5;return h<1?'just now':h<24?Math.round(h)+'h ago':Math.round(h/24)+'d ago'}
function recordHist(ts,ppl){
  const last=fstore.hist[fstore.hist.length-1];
  if(last&&ts<=last.ts)return;
  if(last&&Math.abs(last.ppl-ppl)<0.05&&ts-last.ts<12*36e5)return;
  fstore.hist.push({ts,ppl});fstore.hist=fstore.hist.slice(-40);saveF();
}
function paintFuel(){
  const p=effPrice();
  $('fP').textContent=p.ppl.toFixed(1)+'p';
  const stale=p.stale||(p.ts&&Date.now()-p.ts>14*864e5);
  $('fS').textContent=p.src+(p.ts?' \u00b7 '+ago(p.ts):'');
  $('fS').className='sub'+(stale?' am':'');
  $('fC').textContent=p.extra?'cheapest nearby '+p.extra:(stale?'tap to update the price':'tap to set your own');
  const h=fstore.hist,t=$('fT');
  if(h.length>=2){const d=h[h.length-1].ppl-h[h.length-2].ppl;t.textContent=(d>0.05?'\u25b2 ':d<-0.05?'\u25bc ':'')+Math.abs(d).toFixed(1)+'p';t.className='chip '+(d>0.05?'rd':d<-0.05?'ok':'')}
  else{t.textContent='';t.className='chip'}
  const s=$('fSp');s.textContent='';
  if(h.length>=2){
    const w=96,ht=30,mn=Math.min(...h.map(x=>x.ppl)),mx=Math.max(...h.map(x=>x.ppl)),rg=(mx-mn)||1;
    const pts=h.map((x,i)=>(i/(h.length-1)*w).toFixed(1)+','+(ht-4-((x.ppl-mn)/rg)*(ht-8)).toFixed(1)).join(' ');
    s.innerHTML='<polyline points="'+pts+'" fill="none" stroke="#4cc9f0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>';
  }
}
async function loadFuelAuto(){
  const urls=[];
  const parts=location.pathname.split('/').filter(Boolean);
  if(location.hostname.endsWith('.github.io')&&parts[0])urls.push('https://raw.githubusercontent.com/'+location.hostname.split('.')[0]+'/'+parts[0]+'/main/fuel.json');
  urls.push('fuel.json');
  for(const u of urls){
    try{
      const r=await fetch(u+'?t='+Date.now());if(!r.ok)continue;
      const j=await r.json(),h=j&&j.home;
      if(j&&Array.isArray(j.stations)){fuelStations=j.stations.filter(s=>s&&s.lat&&s.lon&&s.p);fuelUpdated=Date.parse(j.updated)||0}
      if(h&&h.avg){
        fuelAuto={ppl:+h.avg,ts:Date.parse(j.updated)||0,cheapest:h.min?(h.min+'p '+(h.minName||'')).trim():null};
        recordHist(fuelAuto.ts,fuelAuto.ppl);break;
      }
    }catch(e){}
  }
  paintFuel();
}
$('tFuel').onclick=()=>{
  const p=effPrice();
  const v=prompt('Petrol price in pence per litre (e.g. 139.9). Leave blank to go back to the automatic price.',p.ppl.toFixed(1));
  if(v===null)return;
  if(v.trim()===''){delete fstore.manual;saveF();paintFuel();return}
  const n=parseFloat(v);
  if(!(n>80&&n<300)){alert('That does not look right. Enter pence per litre, e.g. 139.9');return}
  fstore.manual={ppl:n,ts:Date.now()};recordHist(Date.now(),n);saveF();paintFuel();
};
paintFuel();loadFuelAuto();


// ---------- petrol near me ----------
let fuelStations=[],fuelUpdated=0,here=null;
const HOME_LL={lat:50.886,lon:-1.245};
function miles(a,b){const R=3958.8,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lon-a.lon)*r;const x=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function getHere(ask){
  return new Promise(res=>{
    if(here&&Date.now()-here.ts<600000)return res(here);
    const fallback=()=>res(here||(here={...HOME_LL,src:'home',ts:Date.now()}));
    if(!ask||!navigator.geolocation)return fallback();
    navigator.geolocation.getCurrentPosition(
      p=>{here={lat:p.coords.latitude,lon:p.coords.longitude,src:'your location',ts:Date.now()};res(here)},
      ()=>{here={...HOME_LL,src:'home',ts:Date.now()};res(here)},
      {enableHighAccuracy:false,timeout:7000,maximumAge:300000});
  });
}
function nearest(n){
  const o=here||{...HOME_LL,src:'home'};
  return fuelStations.map(s=>({...s,d:miles(o,s)})).sort((a,b)=>a.d-b.d).slice(0,n);
}
function nearestLine(){
  if(!fuelStations.length)return '';
  const o=here||{...HOME_LL,src:'home'};
  return `\nNEAREST PETROL STATIONS (E10, straight-line distance from ${o.src}, prices updated ${ago(fuelUpdated)}):\n`+nearest(5).map((s,i)=>`${i+1}. ${s.n}: ${s.p}p per litre, ${s.d.toFixed(1)} miles`).join('\n');
}
function fuelCard(list){
  const c=el('div','card');
  c.append(el('div','ct',`Petrol near ${(here&&here.src)||'home'}`));
  if(!list.length){
    c.append(el('div','sub','No live station prices set up yet. Google Maps now shows UK petrol prices, so use the button below.'));
  }else{
    const cheapest=Math.min(...list.map(s=>s.p));
    list.forEach(s=>{
      const a=el('a','stn');a.href=`https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lon}&travelmode=driving`;a.target='_blank';a.rel='noopener';
      const nm=el('div','nm');nm.append(el('b','',s.n.replace(/\b\w+/g,w=>w.charAt(0)+w.slice(1).toLowerCase())));nm.append(el('span','',`${s.d.toFixed(1)} miles away`));
      a.append(nm,el('span','chip '+(s.p===cheapest?'ok':''),s.p.toFixed(1)+'p'));
      c.append(a);
    });
    c.append(el('div','sub',`Straight-line distances. Prices updated ${ago(fuelUpdated)}. Tap a station for directions.`));
  }
  const g=el('a','btn','Search petrol in Google Maps');g.href='https://www.google.com/maps/search/?api=1&query=petrol+station';g.target='_blank';g.rel='noopener';
  c.append(g);
  log.appendChild(c);toEnd();
}

// ---------- dashboard ----------
function tick(){
  const h=+londonPart('hour');
  $('hello').textContent=(h<5?'Working late, sir.':h<12?'Good morning, sir.':h<18?'Good afternoon, sir.':'Good evening, sir.');
  $('clock').textContent=londonPart('hour')+':'+londonPart('minute');
  $('date').textContent=londonPart('weekday')+' '+londonPart('day')+' '+londonPart('month');
}
tick();setInterval(tick,20000);

async function getLive(force){
  if(!force&&live&&Date.now()-liveAt<600000)return live;
  try{
    const r=await fetch(getWorker()+'/data',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    if(!r.ok)throw new Error(r.status);
    live=await r.json();liveAt=Date.now();
  }catch(e){}
  return live;
}
function paintWeather(){
  const w=(live&&live.weather)||[];
  const h=w.find(x=>/home/i.test(x.name)),k=w.find(x=>/work/i.test(x.name));
  $('wH').textContent=h?h.t+'\u00b0':'--';$('wHd').textContent=h?`${h.desc}, ${h.rain}% rain`:'unavailable';
  $('wW').textContent=k?k.t+'\u00b0':'--';$('wWd').textContent=k?`${k.desc}, ${k.rain}% rain`:'unavailable';
  const n=$('news');n.textContent='';
  const items=live&&live.news?[...(live.news.uk||[]).slice(0,3),...(live.news.local||[]).slice(0,1)]:[];
  if(!items.length)n.append(el('div','sub','Headlines unavailable'));
  items.forEach(t=>n.append(el('div','',t)));
}
function delayClass(d){return d<=2?'ok':d<=9?'am':'rd'}
function paintCommute(){
  $('cDir').textContent=dir==='work'?'To work':'To home';
  const r=commuteUI;
  if(!r){$('cMin').textContent='--';$('cChip').textContent='';return}
  const b=r.options[0];
  $('cMin').textContent=b.min+' min';
  const c=$('cChip');c.className='chip '+delayClass(b.delay);c.textContent=b.delay<=2?'clear roads':'+'+b.delay+' min';
  const n=r.incidents.length;
  $('cSub').textContent=`via ${b.roads.join(', ')||'local roads'} \u00b7 ${n} incident${n===1?'':'s'} \u00b7 tap for route`;
}
async function loadCommute(){
  if(!getWorker())return;
  $('cSub').textContent='Checking traffic...';
  try{
    const r=await fetch(getWorker()+'/commute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dir,ppl:effPrice().ppl})});
    if(!r.ok)throw new Error(r.status);
    const d=await r.json();
    commuteUI=d.route||null;commuteAt=Date.now();
    if(!commuteUI)$('cSub').textContent='Traffic unavailable';
  }catch(e){commuteUI=null;$('cSub').textContent='Traffic unavailable'}
  paintCommute();
}
async function loadDash(force){
  if(!getWorker()){$('cSub').textContent='Tap Set up and add your Worker URL';return}
  await Promise.all([getLive(force).then(paintWeather),loadCommute()]);
}
$('swap').onclick=e=>{e.stopPropagation();dir=dir==='work'?'home':'work';commuteUI=null;paintCommute();loadCommute()};
$('tCommute').onclick=()=>{if(commuteUI){routeCard(commuteUI);}};
$('tNews').onclick=()=>briefing();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-commuteAt>300000)loadDash(true)});

// ---------- voice out ----------
function pickVoice(){
  const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
  const score=v=>{let s=0;if(/en[-_]GB/i.test(v.lang))s+=10;if(/premium/i.test(v.name))s+=6;if(/enhanced/i.test(v.name))s+=4;if(/daniel|arthur|oliver|malcolm/i.test(v.name))s+=5;if(/compact/i.test(v.name))s-=2;return s};
  return vs.sort((a,b)=>score(b)-score(a))[0];
}
function speak(text){
  return new Promise(res=>{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    const v=pickVoice();if(v)u.voice=v;
    u.lang='en-GB';u.rate=1.0;u.pitch=.9;
    u.onstart=()=>setState('speaking','Speaking...');
    u.onboundary=()=>{hud.classList.add('beat');setTimeout(()=>hud.classList.remove('beat'),110)};
    u.onend=u.onerror=()=>{setState('');res()};
    speechSynthesis.speak(u);
  });
}

// ---------- cards ----------
const gmaps=r=>`https://www.google.com/maps/dir/?api=1&origin=${r.a.lat},${r.a.lon}&destination=${r.b.lat},${r.b.lon}&travelmode=driving`;
const amaps=r=>`https://maps.apple.com/?saddr=${r.a.lat},${r.a.lon}&daddr=${r.b.lat},${r.b.lon}&dirflg=d`;

function routeCard(r){
  const c=el('div','card');
  c.append(el('div','ct',`${r.from} \u2192 ${r.to}`));
  const best=r.options[0];
  const big=el('div','row');
  big.append(el('span','n',best.min+' min'));
  big.append(el('span','chip '+delayClass(best.delay),best.delay<=2?'clear roads':`+${best.delay} min delay`));
  if(best.fuel!=null)big.append(el('span','chip gl',`${best.fuel} L \u00b7 \u00a3${best.cost.toFixed(2)}`));
  c.append(big);
  if(r.leave)c.append(el('div','chip ok',`Leave ${r.leave.depart} \u2192 arrive ${r.leave.arrive}`));
  r.options.slice(1).forEach(o=>{
    const row=el('div','opt');
    const l=el('span');l.append(el('b','',o.label.charAt(0)+o.label.slice(1).toLowerCase()));l.append(document.createTextNode(` \u00b7 ${o.roads.join(', ')||'local roads'}`));
    const dt=o.min-best.min;let right=`${dt>=0?'+':''}${dt} min`;
    if(o.fuel!=null&&best.fuel!=null){const df=+(o.fuel-best.fuel).toFixed(1);right+=` \u00b7 ${df>=0?'+':''}${df} L`}
    row.append(l,el('span','',right));c.append(row);
  });
  if(r.incidents.length)r.incidents.slice(0,3).forEach(i=>c.append(el('div','inc','\u25cf '+i.text)));
  else c.append(el('div','inc none','No incidents on your route'));
  const wx=el('div','wx');
  r.weather.forEach(w=>{
    const d=el('div');d.append(el('b','',w.wx?w.wx.t+'\u00b0':'--'));
    d.append(document.createTextNode(w.name||w.label));d.append(el('br'));
    d.append(document.createTextNode(w.wx?`${w.wx.desc}, ${w.wx.rain}%`:'n/a'));wx.append(d);
  });
  c.append(wx);
  const map=el('div','map');c.append(map);
  if(r.a&&r.b){
    const acts=el('div','acts');
    const g=el('a','btn pri','Open in Google Maps');g.href=gmaps(r);g.target='_blank';g.rel='noopener';
    const ap=el('a','btn','Apple Maps');ap.href=amaps(r);ap.target='_blank';ap.rel='noopener';
    acts.append(g,ap);c.append(acts);
  }
  log.appendChild(c);toEnd();
  setTimeout(()=>drawMap(map,r),80);
}
function drawMap(div,r){
  if(!window.L||!r.geom||!r.geom.length)return div.remove();
  try{
    const m=L.map(div,{zoomControl:false,dragging:false,touchZoom:false,scrollWheelZoom:false,doubleClickZoom:false,boxZoom:false,keyboard:false,tap:false,attributionControl:true});
    m.attributionControl.setPrefix('');
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19,attribution:'\u00a9 OpenStreetMap \u00a9 CARTO'}).addTo(m);
    const opts={lineCap:'round',lineJoin:'round'};
    L.polyline(r.geom,{...opts,color:'#4cc9f0',weight:10,opacity:.16}).addTo(m);
    const line=L.polyline(r.geom,{...opts,color:'#4cc9f0',weight:2.5,opacity:1}).addTo(m);
    const ic=(cls,s)=>L.divIcon({className:'',html:`<div class="${cls}"></div>`,iconSize:[s,s],iconAnchor:[s/2,s/2]});
    L.marker(r.geom[0],{icon:ic('mk-start',10),interactive:false}).addTo(m);
    L.marker(r.geom[r.geom.length-1],{icon:ic('mk-end',14),interactive:false}).addTo(m);
    r.incidents.forEach(i=>L.marker([i.lat,i.lon],{icon:ic('mk-inc',9)}).addTo(m).bindTooltip(i.text,{direction:'top',offset:[0,-6]}));
    m.fitBounds(line.getBounds(),{padding:[22,22]});
    setTimeout(()=>m.invalidateSize(),200);
  }catch(e){div.remove()}
}
function briefingCard(d){
  if(!d)return;
  const c=el('div','card');c.append(el('div','ct','Briefing'));
  const wx=el('div','wx');
  (d.weather||[]).forEach(w=>{const x=el('div');x.append(el('b','',w.t+'\u00b0'));x.append(document.createTextNode(w.name));x.append(el('br'));x.append(document.createTextNode(`${w.desc}, ${w.rain}%`));wx.append(x)});
  c.append(wx);
  log.appendChild(c);toEnd();
}

// ---------- brain ----------
function petrolLine(){const p=effPrice();return `\nPETROL: ${p.ppl.toFixed(1)}p per litre (${p.src})${p.extra?'; cheapest nearby '+p.extra:''}.`}
function buildSystem(){
  const now=`${londonPart('weekday')} ${londonPart('day')} ${londonPart('month')} ${londonPart('year')}, ${londonPart('hour')}:${londonPart('minute')} (Europe/London)`;
  const iso=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/London'}).format(new Date());
  return SYSTEM_BASE+`\nNow: ${now}. Today's date as YYYY-MM-DD: ${iso}.\nLIVE DATA:\n`+((live&&live.text)||'unavailable right now, say so if asked')+petrolLine()+nearestLine();
}
async function ask(text,opts){
  if(busy)return;
  const url=getWorker();
  if(!url){add('e','Tap "Set up" and add your Worker URL first.');return}
  busy=true;add('u',text);history.push({role:'user',content:text});
  setState('thinking','Thinking...');
  try{
    await getLive(opts&&opts.fresh);
    if(opts&&opts.card)briefingCard(live);
    if(opts&&opts.fuel){await getHere(true);fuelCard(nearest(5))}
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system:buildSystem(),messages:history.slice(-12),ppl:effPrice().ppl})});
    if(!r.ok)throw new Error('Worker returned '+r.status);
    const data=await r.json();
    const reply=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join(' ').trim();
    if(!reply)throw new Error(typeof data.error==='string'?data.error:'Empty reply');
    history.push({role:'assistant',content:reply});lastReply=reply;
    if(data.ui&&data.ui.route)routeCard(data.ui.route);
    add('j',reply);sfx.done();
    busy=false;await speak(reply);
    if(handsFree)setTimeout(listen,450);
  }catch(e){history.pop();add('e','Could not reach the brain: '+e.message);sfx.err();setState('')}
  busy=false;
}
const toOther=()=>dir==='work'?['home','work']:['work','home'];
const briefing=()=>ask('Give me my briefing.',{card:true,fresh:true});

// ---------- voice in ----------
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,listening=false;
function listen(){
  if(!SR){add('e','Speech recognition is not supported here. Use the keyboard mic instead.');return}
  if(listening){rec&&rec.stop();return}
  if(busy)return;
  speechSynthesis.cancel();
  rec=new SR();rec.lang='en-GB';rec.interimResults=false;rec.maxAlternatives=1;
  rec.onstart=()=>{listening=true;sfx.wake();setState('listening','Listening...')};
  rec.onresult=e=>ask(e.results[0][0].transcript);
  rec.onerror=e=>{if(e.error!=='no-speech'&&e.error!=='aborted')add('e','Mic error: '+e.error);setState('')};
  rec.onend=()=>{listening=false;if(hud.className==='listening')setState('')};
  rec.start();
}
hud.onclick=listen;
hud.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();listen()}};
$('qb').onclick=briefing;
$('qw').onclick=()=>ask("How's the drive from home to work right now?");
$('qh').onclick=()=>ask("How's the drive from work to home right now?");
$('ql').onclick=()=>{const [f,t]=toOther();const v=prompt(`Arrive at ${t} by what time? (e.g. 08:00)`);if(v)ask(`What time should I leave ${f} to arrive at ${t} by ${v}? Use tomorrow if that time has already passed today.`)};
$('qp').onclick=async()=>{
  if(!fuelStations.length){await getHere(false);fuelCard([]);return}
  ask("Where's the nearest petrol, and which of the closest is cheapest?",{fuel:true});
};
$('qr').onclick=()=>{if(lastReply)speak(lastReply)};
$('f').onsubmit=e=>{e.preventDefault();const v=$('t').value.trim();if(v){$('t').value='';$('t').blur();ask(v)}};
speechSynthesis.onvoiceschanged=()=>{};

// ?cmd=briefing | work | home  (iPhone Shortcuts): skips the boot screen
const cmd=new URLSearchParams(location.search).get('cmd');
const boot=$('boot');let booted=false;
function endBoot(sound){
  if(booted)return;booted=true;
  if(sound){ac();sfx.boot()}
  boot.classList.add('out');setTimeout(()=>boot.remove(),800);
}
if(cmd){
  booted=true;boot.remove();
  const run={briefing,work:()=>ask("How's the drive from home to work right now?"),home:()=>ask("How's the drive from work to home right now?")}[cmd];
  if(run)setTimeout(run,600);history.replaceState(null,'',location.pathname);
}else{
  const lines=['Initialising core','Linking traffic feeds','Weather online','Tap to begin'];
  lines.forEach((t,i)=>setTimeout(()=>{if(!booted)$('bootLine').textContent=t},i*700));
  boot.addEventListener('click',()=>endBoot(true));
  setTimeout(()=>endBoot(false),7000);
}

loadDash(false);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
